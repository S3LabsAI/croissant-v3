<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sources review</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="review.css">
</head>
<body>
<header>
  <img src="icons/icon32.png" alt="" width="22" height="22">
  <div class="ttl"><b id="title">Sources review</b><small id="sub"></small></div>
  <span class="sp"></span>
  <a id="bestHours" class="btn" target="_blank">Best hours</a>
  <a id="openGoal" class="btn" target="_blank" hidden>Open in GOAL</a>
  <button id="refresh">Refresh</button>
</header>
<main>
  <div id="banners"></div>
  <div id="camps"><div class="muted pad">Loading sources from GOAL...</div></div>
  <div id="applyBar" hidden>
    <div class="note">Raises only the checked multipliers, by 10% of the current value (never more than 25 points at once). Base bids and daily limits aren't touched.</div>
    <button id="apply" class="pri">Apply</button>
  </div>
  <div id="results"></div>
  <section id="logWrap" hidden>
    <h3>Recent bid changes from this extension</h3>
    <div id="log"></div>
  </section>
</main>
<script src="review.js"></script>
</body>
</html>
