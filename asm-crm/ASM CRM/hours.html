<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Best hours</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="review.css">
<link rel="stylesheet" href="hours.css">
</head>
<body>
<header>
  <img src="icons/icon32.png" alt="" width="22" height="22">
  <div class="ttl"><b>Best hours</b><small>Your local time. Insight only: nothing here changes bids or budgets.</small></div>
  <span class="sp"></span>
  <div class="seg" id="days"><button data-v="14">14 days</button><button data-v="28">28 days</button></div>
  <div class="seg" id="type"><button data-v="all">All days</button><button data-v="wkday">Weekdays</button><button data-v="wkend">Weekends</button></div>
</header>
<main class="hmain">
  <div id="status"></div>
  <div class="grid">
    <aside>
      <input id="q" type="search" placeholder="Search account or #id">
      <div id="list"></div>
    </aside>
    <section id="detail"><div class="muted pad">Loading...</div></section>
  </div>
</main>
<script src="hours-page.js"></script>
</body>
</html>
